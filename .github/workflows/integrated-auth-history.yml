name: Integrated real auth and UI history
on:
  pull_request:
    branches: [feat/bootstrap-frontend]
  push:
    branches: [feat/bootstrap-frontend]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  integrated-r9:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: jamartinezv2023/ilp_backend
          ref: 4d49544423673c7cf507e05297d620203e1de048
          path: backend
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: frontend
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - uses: gradle/actions/setup-gradle@v4
      - run: chmod +x gradlew
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Auth error boundary regression
        run: ./gradlew --no-daemon --no-configuration-cache :auth-service:test --tests '*LoginBoundaryExceptionHandlerTest' --tests '*SessionIdentityControllerTest' --tests '*OfflineAccessControllerTest'
        working-directory: backend
      - name: Real login, authorization, UI submission and history
        run: node e2e/integrated-r9/run.mjs ../backend
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: integrated-r9-${{ github.event.pull_request.head.sha || github.sha }}
          path: |
            frontend/test-results
            frontend/playwright-report/integrated-r9
            backend/auth-service/build/test-results/test
          if-no-files-found: warn
