name: Frontend CI

on:
  push:
    branches:
      - main
      - "feat/**"
      - "fix/**"
  pull_request:
    branches:
      - main
      - feat/bootstrap-frontend

permissions:
  contents: read

jobs:
  build-and-analyze:
    name: Build, Tests, Coverage and SonarCloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Lint frontend
        run: npm run lint
      - name: Typecheck tests
        run: npm run test:types
      - name: Build frontend
        run: npm run build
      - name: Verify compiled JavaScript sizes
        run: |
          python - <<'PYTHON'
          from pathlib import Path
          files = list(Path("dist/assets").glob("*.js"))
          if not files:
              raise SystemExit("No compiled JavaScript files found")
          for file in files:
              size = file.stat().st_size
              print(f"{file.name}: {size} bytes")
              if size > 500_000:
                  raise SystemExit(f"JavaScript file exceeds 500 kB: {file.name}")
          PYTHON
      - name: Unit and component coverage
        run: npm run test:coverage
      - name: Verify LCOV source mapping
        run: npm run coverage:verify
      - name: Preserve coverage evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: frontend-coverage-${{ github.sha }}
          path: coverage/
          if-no-files-found: error
      - name: SonarCloud Scan and Quality Gate
        if: >-
          github.event_name == 'pull_request' ||
          github.ref == 'refs/heads/main' ||
          github.ref == 'refs/heads/feat/bootstrap-frontend'
        uses: SonarSource/sonarqube-scan-action@v6
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=jamartinezv2023_ilp_frontend
            -Dsonar.organization=jamartinezv2023
            -Dsonar.sources=src
            -Dsonar.tests=tests/unit
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.exclusions=**/node_modules/**,**/dist/**
            -Dsonar.qualitygate.wait=true
            -Dsonar.qualitygate.timeout=600
