name: P02 synthetic durable draft
on:
  pull_request:
    branches: [feat/bootstrap-frontend]
  push:
    branches: [feat/bootstrap-frontend]
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.p02-draft.config.ts
      - name: Verify ten cases without skips
        run: |
          python - <<'PY'
          import xml.etree.ElementTree as ET
          root = ET.parse('test-results/p02-draft-results.xml').getroot()
          assert len(root.findall('.//testcase')) == 10
          assert not any(root.findall('.//' + tag) for tag in ['failure', 'error', 'skipped'])
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p02-draft-evidence
          path: |
            test-results/p02-draft*
            playwright-report/p02-draft
