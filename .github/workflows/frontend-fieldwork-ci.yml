name: ILP Frontend Fieldwork CI

on:
  push:
    branches:
      - main
      - deployment/**
      - implementation/**
  pull_request:
    branches:
      - main

jobs:
  frontend-quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        run: npm install

      - name: Build
        run: npm run build

      - name: Docker build
        run: docker build --build-arg VITE_ADAPTIVE_API_BASE_URL=http://localhost:8083 -t ilp-frontend:ci .
