name: Review Demo CI

on:
  push:
    branches:
      - "review/**"
  pull_request:
    branches:
      - "feat/bootstrap-frontend"

permissions:
  contents: read

jobs:
  review-demo:
    name: Lint, Build, Model and Browser
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: node --test tests/pilot/review-model.test.mjs
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test --config playwright.review.config.ts
      - name: Upload browser evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: review-browser-evidence
          path: |
            review-browser-results.json
            review-browser-artifacts/
          if-no-files-found: ignore
